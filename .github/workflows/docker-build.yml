name: Build and Push Python Docker image

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ediko-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Log in to Nexus
      - name: Log in to Nexus Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASS }}

      # 3. Build & push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/ediko/my-python-app:${{ github.sha }}
            ${{ secrets.NEXUS_REGISTRY }}/ediko/my-python-app:latest
          buildkitd-flags: '--add-hosts edi.crocobet.ro:10.0.10.96'
          driver-opts: network=host
          network: host